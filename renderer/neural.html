<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Echo — Neural Core</title>
  <link rel="stylesheet" href="synapse/synapse-field.css" />
  <link rel="stylesheet" href="neural.css" />
</head>
<body>
  <div id="panel">
    <div id="bar">
      <span class="dot"></span>
      <span class="ttl">NEURAL CORE · SYNAPTIC FIELD</span>
      <span class="sp"></span>
      <button id="map" title="Switch micrograph">◍</button>
      <button id="reset" title="Reset view (R)">⌖</button>
      <button id="close" title="Close (Esc)">✕</button>
    </div>
    <div id="stage">
      <div id="field"></div>
      <div class="hud">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="read l">
          <div class="d">CELL BODIES</div><div><b id="nodes">—</b> mapped</div>
          <div class="d" style="margin-top:6px">FIBRES</div><div id="syn">—</div>
        </div>
        <div class="read r">
          <div class="d">CORE STATE</div><div><b id="corestate">IDLE</b></div>
          <div class="d" style="margin-top:6px">ACTION POTENTIALS</div><div id="temp">0 live</div>
        </div>
        <div class="read c" id="viewinfo">scroll zoom · drag pan · shift-drag rotate</div>
      </div>
    </div>
  </div>
  <script src="synapse/neuronmap-data.js"></script>
  <script src="synapse/synapse-maps.js"></script>
  <script src="synapse/synapse-field.js"></script>
  <script src="neural.js"></script>
</body>
</html>
